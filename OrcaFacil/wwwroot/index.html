<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!--
      Não nasce com of-tema-claro: no escuro o primeiro quadro não pode pintar #EFF3F7.
      O script é bloqueante e roda antes do CSS. Com a classe no localStorage
      (gravada por OrcaFacilTema.aplicar), ela entra no html agora.
      Sem classe, color-scheme: light dark deixa o fundo seguir o sistema
      até o Blazor resolver. O padrão do app é Automático, que também segue o sistema.
    -->
    <script>
        (function () {
            var classe = null;
            try {
                classe = localStorage.getItem("orcafacil.tema.classe");
            } catch (e) {
            }
            if (classe === "of-tema-claro" || classe === "of-tema-escuro")
                document.documentElement.classList.add(classe);
        })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pro Orçamento</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/orcafacil-theme.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="OrcaFacil.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">Carregando...</div>

    <div id="blazor-error-ui" data-nosnippet>
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/mascaraNumerica.js"></script>
    <script src="js/teclado.js"></script>
    <script src="js/menuFoco.js"></script>
    <script src="js/tema.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
